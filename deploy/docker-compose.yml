version: "3.9"

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fastapi_app
    ports:
      - "8010:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - platform_net

  redis:
    image: redis:7-alpine
    container_name: redis_db
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - platform_net

networks:
  platform_net:

volumes:
  redis_data:
