---
name: CI-Production-Grade

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build and Start Stack
        run: docker-compose -f deploy/docker-compose.yml up --build -d

      - name: Wait for services
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:8010/health; do sleep 2; done'

      - name: Run Integration Test
        run: |
          # write test key
          curl -X POST "http://localhost:8010/write/example_key?value=passed"

          sleep 2
          # read from redis
          RESPONSE=$(curl -s http://localhost:8010/)

          if [[ "$RESPONSE" == *"passed"* ]]; then
            echo "Integration Test Passed"
          else
            echo "Integration Test Failed: $RESPONSE"
            exit 1
          fi
      - name: Lint Python
        run: |
          docker run --rm \
          -v $(pwd)/app:/app \
          pipelinecomponents/flake8 \
          flake8 /app --ignore=E501

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f deploy/docker-compose.yml down
