name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t fastapi-app -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d -p 8010:8000 --name test_app fastapi-app

      - name: Wait for app startup
        run: sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:8010/health

      - name: Stop container
        if: always()
        run: |
          docker stop test_app
          docker rm test_app

